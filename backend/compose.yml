services:
  db:
    image: postgres:15
    container_name: postgres-qr-badge
    environment:
      POSTGRES_DB: qr_badge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your-password
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  app:
    image: qrcodetest9:test
    container_name: qr-badge-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  cron:
    image: qrcodetest9:test
    container_name: qr-badge-cron
    env_file:
      - .env
    depends_on:
      - db
    # Toutes les 5 minutes : heartbeats + absents non badgés + séances auto
    entrypoint: >
      sh -c "while true; do
        python manage.py process_mobile_heartbeats;
        python manage.py auto_close_pointages --skip-heartbeat;
        python manage.py auto_sessions;
        sleep 300;
      done"
    restart: unless-stopped
  
volumes:

  postgres_data:
    driver: local
    
networks:
  default:
    name: qr-badge-network
    external: true
