services:
  db:
    image: postgres:15
    container_name: postgres-qr-badge
    environment:
      POSTGRES_DB: qr_badge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-local-dev}
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: qr-badge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    
  app:
    image: qrcodetest9:test
    container_name: qr-badge-app
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  cron:
    image: qrcodetest9:test
    container_name: qr-badge-cron
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    # Toutes les 5 minutes : heartbeats + absents non badgés + séances auto
    entrypoint: >
      sh -c "while true; do
        python manage.py process_mobile_heartbeats;
        python manage.py auto_close_pointages --skip-heartbeat;
        python manage.py auto_sessions;
        sleep 300;
      done"
    restart: unless-stopped
  
volumes:

  postgres_data:
    driver: local
  redis_data:
    driver: local
    
networks:
  default:
    name: qr-badge-network
    external: true
