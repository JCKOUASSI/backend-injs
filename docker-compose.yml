###########################################
# INJS-LMD stack Docker (dev & prod)
#
#   docker compose up -d --build
#
# Accès :
#   - Application (SPA + API via proxy Nginx) : http://localhost:${PORT_WEB:-80}
#   - API directe backend                    : http://localhost:8000
#   - Admin Django                           : http://localhost:${PORT_WEB:-80}/admin/
###########################################

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-${POSTGRES_DB:-injs}}
      POSTGRES_USER: ${DB_USER:-${POSTGRES_USER:-injs}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-injs_dev_password}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${PORT_DB:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-${POSTGRES_USER:-injs}} -d ${DB_NAME:-${POSTGRES_DB:-injs}}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${PORT_REDIS:-6379}:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-injs}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-injs}
    ports:
      - "${PORT_RABBITMQ:-5672}:5672"
      - "${PORT_RABBITMQ_MGMT:-15672}:15672"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["/app/entrypoint.sh"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DEBUG: ${DEBUG:-0}
      SECRET_KEY: ${SECRET_KEY:-${DJANGO_SECRET_KEY:-change-me-secret-key-prod}}
      POSTGRES_DB: ${DB_NAME:-${POSTGRES_DB:-injs}}
      POSTGRES_USER: ${DB_USER:-${POSTGRES_USER:-injs}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-injs_dev_password}}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://injs:injs@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@injs.local}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin123}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_FIRST_NAME: ${DJANGO_SUPERUSER_FIRST_NAME:-Admin}
      DJANGO_SUPERUSER_LAST_NAME: ${DJANGO_SUPERUSER_LAST_NAME:-INJS}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-injs.badge-qr-code.pro,localhost,127.0.0.1,backend}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://injs.badge-qr-code.pro}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://injs.badge-qr-code.pro}
      TRUST_FORWARDED_PROTO: "1"
      USE_X_FORWARDED_HOST: "1"
      PORT: "8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_BADGE_BASE_URL: ${VITE_BADGE_BASE_URL:-https://injs.badge-qr-code.pro}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PORT_WEB:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  media_data:
  static_data:
