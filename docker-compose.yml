services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${DOCKER_BACKEND_IMAGE:-ophirdesire/qrcode-badge}:${BACKEND_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose: ["8000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://injs.badge-qr-code.pro/api}
        VITE_BADGE_BASE_URL: ${VITE_BADGE_BASE_URL:-https://injs.badge-qr-code.pro}
    image: ${DOCKER_FRONTEND_IMAGE:-ophirdesire/qr-badge-frontend}:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    expose: ["80"]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [backend, frontend]
    ports: ["80:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro

volumes:
  pgdata:
  static_volume:
  media_volume:
