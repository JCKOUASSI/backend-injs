# Production / Staging Docker Compose pour INJS-LMD (injs.badge-qr-code.pro)
# Compatible avec backend/config/settings.py (supporte DB_* et POSTGRES_*, DEBUG/DJANGO_DEBUG)
# Usage:
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose exec backend python manage.py migrate
#   docker compose exec backend python scripts/create_admin_prod.py

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME:-${POSTGRES_DB:-injs}}
      POSTGRES_USER: ${DB_USER:-${POSTGRES_USER:-injs}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:?DB_PASSWORD requis dans .env}}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-${POSTGRES_USER:-injs}} -d ${DB_NAME:-${POSTGRES_DB:-injs}}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_BADGE_BASE_URL: https://injs.badge-qr-code.pro
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro

volumes:
  pgdata:
  static_volume:
  media_volume:
