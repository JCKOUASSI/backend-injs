services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: injs_lmd
      POSTGRES_USER: injs
      POSTGRES_PASSWORD: injs_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U injs -d injs_lmd"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: injs
      RABBITMQ_DEFAULT_PASS: injs
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_injs_demo &&
             gunicorn injs_lmd.wsgi:application --bind 0.0.0.0:8001 --workers 4 --timeout 120"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8001:8001"
    environment:
      DJANGO_SETTINGS_MODULE: injs_lmd.settings.development
      USE_POSTGRES: "true"
      DJANGO_SECRET_KEY: docker-dev-secret-injs-2026
      POSTGRES_DB: injs_lmd
      POSTGRES_USER: injs
      POSTGRES_PASSWORD: injs_dev_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://injs:injs@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ELASTICSEARCH_URL: http://elasticsearch:9200
      MINIO_ENDPOINT: http://minio:9000
      ALLOWED_HOSTS: localhost,127.0.0.1,api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A injs_lmd worker -l info
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: injs_lmd.settings.development
      USE_POSTGRES: "true"
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://injs:injs@rabbitmq:5672//
    depends_on:
      - api
      - rabbitmq

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A injs_lmd beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: injs_lmd.settings.development
      USE_POSTGRES: "true"
      POSTGRES_HOST: db
      CELERY_BROKER_URL: amqp://injs:injs@rabbitmq:5672//
    depends_on:
      - celery

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/app/media:ro
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  media_data:
