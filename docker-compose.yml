###########################################
# INJS-LMD stack locale (dev) + services annexes
#
# Backend prod VPS : voir .github/workflows/deploy-vps.yml
#
#   docker compose up --build
#
# Accès :
#   - Application (SPA + API) : http://localhost:8080
#   - API directe             : http://localhost:8000
#   - Admin Django            : http://localhost:8000/admin/
###########################################

name: injs-lmd-local

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-injs_lmd}
      POSTGRES_USER: ${POSTGRES_USER:-injs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-injs_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-injs} -d ${POSTGRES_DB:-injs_lmd}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: injs
      RABBITMQ_DEFAULT_PASS: injs
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/app/entrypoint.sh"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY:-docker-dev-secret-injs-2026}
      POSTGRES_DB: ${POSTGRES_DB:-injs_lmd}
      POSTGRES_USER: ${POSTGRES_USER:-injs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-injs_dev_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://injs:injs@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DJANGO_SUPERUSER_EMAIL: admin@demo.injs.ci
      DJANGO_SUPERUSER_PASSWORD: Demo@INJS2026!
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_FIRST_NAME: Admin
      DJANGO_SUPERUSER_LAST_NAME: INJS
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      USE_POSTGRES: "true"
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      VITE_API_URL: /api/v1

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  media_data:
  static_data: