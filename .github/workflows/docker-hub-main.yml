# Branche `main` (production) — build & push linux/amd64 vers Docker Hub.
#
# Cible d’exécution : AlmaLinux x86_64 (--platform linux/amd64).
#
# Équivalent local :
#   backend  : docker buildx build --platform linux/amd64 -t jckouassi/injs-be:v1.1.40-amd64 --push ./backend
#   frontend : docker buildx build --platform linux/amd64 \
#                --build-arg VITE_API_URL=https://api.sygepcpfae.org/api \
#                --build-arg VITE_BADGE_BASE_URL=https://api.sygepcpfae.org \
#                -t jckouassi/injs-fe:1.0.44-amd64 --push ./frontend
#
# Secrets : DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#
# Variables optionnelles (préfixe DOCKER_MAIN_* pour ne pas chevaucher channel1) :
#   DOCKER_MAIN_VERSION_PREFIX (défaut 1.1), DOCKER_MAIN_BACKEND_TAG, DOCKER_MAIN_FRONTEND_TAG
#   DOCKER_MAIN_VITE_API_URL, DOCKER_MAIN_VITE_BADGE_BASE_URL
#
# Tags poussés à chaque run (prod) :
#   - tag versionné (auto ou manuel), ex: v1.1.123-amd64
#   - main-<tag_versionné>, ex: main-v1.1.123-amd64 (même image, nom explicite branche prod)
#   - latest-amd64 + latest (rolling, même image que le tag versionné)

name: Docker Hub (main / prod)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 1.1.44). Vide => auto via run_number"
        required: false
        type: string
      backend_tag:
        description: "Tag backend (override total). Vide => calculé"
        required: false
        type: string
      frontend_tag:
        description: "Tag frontend (override total). Vide => calculé"
        required: false
        type: string
      skip_deploy:
        description: "Ne pas déployer sur le VPS"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-hub-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push prod (linux/amd64)
    runs-on: [self-hosted, macOS, ARM64, backend-injs]
    outputs:
      backend_ref: ${{ steps.cfg.outputs.backend_ref }}
      frontend_ref: ${{ steps.cfg.outputs.frontend_ref }}
    env:
      BACKEND_IMAGE: ${{ vars.DOCKER_BACKEND_IMAGE }}
      FRONTEND_IMAGE: ${{ vars.DOCKER_FRONTEND_IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Driver natif : évite de tirer moby/buildkit depuis Docker Hub (timeouts CI fréquents).
          driver: docker

      - name: Tags et build-args (prod)
        id: cfg
        run: |
          # Stratégie tags :
          # - si backend_tag/frontend_tag fournis (workflow_dispatch) => utilisés tels quels
          # - sinon si Variables GitHub DOCKER_MAIN_*_TAG => utilisées
          # - sinon => auto: v<MAJOR>.<MINOR>.<run_number>-amd64
          PREFIX="${DOCKER_MAIN_VERSION_PREFIX:-1.1}"
          AUTO="v${PREFIX}.${GITHUB_RUN_NUMBER}-amd64"
          REQ_VERSION="${{ inputs.version }}"
          if [ -n "${REQ_VERSION}" ]; then
            AUTO="v${REQ_VERSION}-amd64"
          fi

          BT="${{ inputs.backend_tag }}"
          FT="${{ inputs.frontend_tag }}"
          if [ -z "${BT}" ]; then BT="${DOCKER_MAIN_BACKEND_TAG:-$AUTO}"; fi
          if [ -z "${FT}" ]; then FT="${DOCKER_MAIN_FRONTEND_TAG:-$AUTO}"; fi
          API="${DOCKER_MAIN_VITE_API_URL:-https://injs.badge-qr-code.pro/api}"
          BADGE="${DOCKER_MAIN_VITE_BADGE_BASE_URL:-https://injs.badge-qr-code.pro}"
          if [ -z "$BACKEND_IMAGE" ] || [ -z "$FRONTEND_IMAGE" ]; then
            echo "::error::BACKEND_IMAGE et FRONTEND_IMAGE doivent être configurés"
            exit 1
          fi
          case "$BACKEND_IMAGE" in
            ophirdesire/*) ;;
            *) echo "::error::BACKEND_IMAGE doit être dans le namespace ophirdesire/"; exit 1 ;;
          esac
          case "$FRONTEND_IMAGE" in
            ophirdesire/*) ;;
            *) echo "::error::FRONTEND_IMAGE doit être dans le namespace ophirdesire/"; exit 1 ;;
          esac
          echo "backend_ref=${BACKEND_IMAGE}:${BT}" >> "$GITHUB_OUTPUT"
          echo "frontend_ref=${FRONTEND_IMAGE}:${FT}" >> "$GITHUB_OUTPUT"
          echo "backend_main_ref=${BACKEND_IMAGE}:main-${BT}" >> "$GITHUB_OUTPUT"
          echo "frontend_main_ref=${FRONTEND_IMAGE}:main-${FT}" >> "$GITHUB_OUTPUT"
          echo "vite_api=${API}" >> "$GITHUB_OUTPUT"
          echo "vite_badge=${BADGE}" >> "$GITHUB_OUTPUT"
        env:
          DOCKER_MAIN_VERSION_PREFIX: ${{ vars.DOCKER_MAIN_VERSION_PREFIX }}
          DOCKER_MAIN_BACKEND_TAG: ${{ vars.DOCKER_MAIN_BACKEND_TAG }}
          DOCKER_MAIN_FRONTEND_TAG: ${{ vars.DOCKER_MAIN_FRONTEND_TAG }}
          DOCKER_MAIN_VITE_API_URL: ${{ vars.DOCKER_MAIN_VITE_API_URL }}
          DOCKER_MAIN_VITE_BADGE_BASE_URL: ${{ vars.DOCKER_MAIN_VITE_BADGE_BASE_URL }}

      - name: Build & push backend
        id: backend_image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.cfg.outputs.backend_ref }}
            ${{ steps.cfg.outputs.backend_main_ref }}
            ${{ env.BACKEND_IMAGE }}:latest-amd64
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Vérifier staticfiles (appuser, collectstatic)
        run: |
          IMG="${{ steps.cfg.outputs.backend_ref }}"
          docker pull --platform linux/amd64 "$IMG"
          OWNER=$(docker run --platform linux/amd64 --rm --entrypoint stat "$IMG" -c '%U' /app/staticfiles)
          if [ "$OWNER" != "appuser" ]; then
            echo "::error::/app/staticfiles appartient à ${OWNER} (attendu: appuser). Ne pas lancer collectstatic en root sur le VPS."
            exit 1
          fi
          # Le chemin /app/staticfiles appartient au conteneur ; sa présence
          # et son contenu sont vérifiés dans les commandes docker ci-dessous.
          docker run --platform linux/amd64 --rm --entrypoint /bin/sh "$IMG" -c '
            test -d /app/staticfiles &&
            test -n "$(find /app/staticfiles -type f -print -quit)"
          '

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.cfg.outputs.frontend_ref }}
            ${{ steps.cfg.outputs.frontend_main_ref }}
            ${{ env.FRONTEND_IMAGE }}:latest-amd64
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_API_URL=${{ steps.cfg.outputs.vite_api }}
            VITE_BADGE_BASE_URL=${{ steps.cfg.outputs.vite_badge }}

  diagnose-vps:
    name: Préflight VPS lecture seule
    needs: build-and-push
    runs-on: [self-hosted, macOS, ARM64, backend-injs]
    steps:
      - name: Vérifier les paramètres SSH sans afficher les secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_BACKEND_DIR: ${{ vars.VPS_BACKEND_DIR }}
          VPS_FRONTEND_DIR: ${{ vars.VPS_FRONTEND_DIR }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_BACKEND_DIR"
          test -n "$VPS_FRONTEND_DIR"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          ssh -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "${VPS_USER}@${VPS_HOST}" \
            env BACKEND_DIR="$VPS_BACKEND_DIR" FRONTEND_DIR="$VPS_FRONTEND_DIR" \
            bash -s <<'REMOTE'
          set -eu
          echo "=== VPS_PRECHECK ==="
          printf "host="; hostname
          echo "containers:"
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}" | head -30
          for dir in "$BACKEND_DIR" "$FRONTEND_DIR"; do
            echo "=== directory: $dir ==="
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 2 -type f \( -name 'compose.yml' -o -name 'compose.yaml' -o -name 'docker-compose.yml' -o -name 'docker-compose.yaml' -o -name '*.conf' \) -print | sort
              find "$dir" -maxdepth 2 -type f -name '.env' -print
            else
              echo "missing"
            fi
          done
          echo "=== nginx route references ==="
          grep -RInE "injs\.badge-qr-code\.pro|location[[:space:]]+/api|proxy_pass" /etc/nginx /usr/local/openresty/nginx/conf /etc/openresty 2>/dev/null | head -120 || true
          echo "=== listening ports ==="
          (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null || true) | head -80
          REMOTE

  deploy:
    name: Déployer sur le VPS
    needs: [build-and-push, diagnose-vps]
    if: ${{ inputs.skip_deploy != true }}
    uses: ./.github/workflows/deploy-vps.yml
    with:
      environment: production
      backend_image: ${{ needs.build-and-push.outputs.backend_ref }}
      frontend_image: ${{ needs.build-and-push.outputs.frontend_ref }}
    secrets: inherit
