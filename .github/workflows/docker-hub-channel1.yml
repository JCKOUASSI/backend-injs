# Branche test `channel1` — build & push linux/amd64 vers Docker Hub.
#
# Cible d’exécution des conteneurs : AlmaLinux x86_64 (images --platform linux/amd64).
# Le job GitHub reste sur ubuntu-latest (buildx) ; pour builder sur un runner
# self-hosted AlmaLinux, remplace runs-on ci-dessous par tes labels.
#
# Équivalent local :
#   backend  : docker buildx build --platform linux/amd64 -t ophirdesire/qrcode-badge:<tag> --push ./backend
#   frontend : docker buildx build --platform linux/amd64 --build-arg VITE_API_URL=... --push ./frontend
#
# Secrets : DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (compte ophirdesire)
#
# Variables optionnelles (Actions → Variables) pour surcharger les tags / URLs :
#   DOCKER_VERSION_PREFIX (défaut 1.1), DOCKER_BACKEND_TAG, DOCKER_FRONTEND_TAG
#   DOCKER_VITE_API_URL       défaut https://api.badge-qr-code.pro/api
#   DOCKER_VITE_BADGE_BASE_URL (optionnel, passé au Dockerfile si défini)
#
# Tags poussés à chaque run (channel1) :
#   - tag versionné (auto ou manuel)
#   - channel1-latest-amd64 (même image que le tag versionné)

name: Docker Hub (channel1)

on:
  push:
    branches: [channel1]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 1.1.44). Vide => auto via run_number"
        required: false
        type: string
      backend_tag:
        description: "Tag backend (override total). Vide => calculé"
        required: false
        type: string
      frontend_tag:
        description: "Tag frontend (override total). Vide => calculé"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: docker-hub-channel1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push (linux/amd64)
    runs-on: ubuntu-latest
    env:
      BACKEND_IMAGE: ophirdesire/qrcode-badge
      FRONTEND_IMAGE: ophirdesire/qr-badge-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tags et build-args
        id: cfg
        run: |
          # Stratégie tags :
          # - si backend_tag/frontend_tag fournis (workflow_dispatch) => utilisés tels quels
          # - sinon si Variables GitHub DOCKER_*_TAG => utilisées
          # - sinon => auto: v<MAJOR>.<MINOR>.<run_number>-amd64
          #
          # En plus du tag versionné “standard”, on pousse aussi :
          #   - channel1-<tag_versionné> (ex: channel1-v1.1.123-amd64)
          #   - channel1-latest-amd64
          PREFIX="${DOCKER_VERSION_PREFIX:-1.1}"
          AUTO="v${PREFIX}.${GITHUB_RUN_NUMBER}-amd64"
          REQ_VERSION="${{ inputs.version }}"
          if [ -n "${REQ_VERSION}" ]; then
            AUTO="v${REQ_VERSION}-amd64"
          fi

          BT="${{ inputs.backend_tag }}"
          FT="${{ inputs.frontend_tag }}"
          if [ -z "${BT}" ]; then BT="${DOCKER_BACKEND_TAG:-$AUTO}"; fi
          if [ -z "${FT}" ]; then FT="${DOCKER_FRONTEND_TAG:-$AUTO}"; fi
          API="${DOCKER_VITE_API_URL:-https://api.badge-qr-code.pro/api}"
          BADGE="${DOCKER_VITE_BADGE_BASE_URL:-}"
          echo "backend_ref=${BACKEND_IMAGE}:${BT}" >> "$GITHUB_OUTPUT"
          echo "frontend_ref=${FRONTEND_IMAGE}:${FT}" >> "$GITHUB_OUTPUT"
          echo "backend_channel_ref=${BACKEND_IMAGE}:channel1-${BT}" >> "$GITHUB_OUTPUT"
          echo "frontend_channel_ref=${FRONTEND_IMAGE}:channel1-${FT}" >> "$GITHUB_OUTPUT"
          echo "vite_api=${API}" >> "$GITHUB_OUTPUT"
          echo "vite_badge=${BADGE}" >> "$GITHUB_OUTPUT"
        env:
          DOCKER_VERSION_PREFIX: ${{ vars.DOCKER_VERSION_PREFIX }}
          DOCKER_BACKEND_TAG: ${{ vars.DOCKER_BACKEND_TAG }}
          DOCKER_FRONTEND_TAG: ${{ vars.DOCKER_FRONTEND_TAG }}
          DOCKER_VITE_API_URL: ${{ vars.DOCKER_VITE_API_URL }}
          DOCKER_VITE_BADGE_BASE_URL: ${{ vars.DOCKER_VITE_BADGE_BASE_URL }}

      - name: Build & push backend
        id: backend_image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.cfg.outputs.backend_ref }}
            ${{ steps.cfg.outputs.backend_channel_ref }}
            ${{ env.BACKEND_IMAGE }}:channel1-latest-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vérifier staticfiles (appuser, collectstatic)
        run: |
          IMG="${{ steps.cfg.outputs.backend_ref }}"
          docker pull "$IMG"
          OWNER=$(docker run --rm "$IMG" stat -c '%U' /app/staticfiles)
          if [ "$OWNER" != "appuser" ]; then
            echo "::error::/app/staticfiles appartient à ${OWNER} (attendu: appuser). Ne pas lancer collectstatic en root sur le VPS."
            exit 1
          fi
          docker run --rm "$IMG" python manage.py collectstatic --noinput --dry-run

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.cfg.outputs.frontend_ref }}
            ${{ steps.cfg.outputs.frontend_channel_ref }}
            ${{ env.FRONTEND_IMAGE }}:channel1-latest-amd64
          build-args: |
            VITE_API_URL=${{ steps.cfg.outputs.vite_api }}
            VITE_BADGE_BASE_URL=${{ steps.cfg.outputs.vite_badge }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
