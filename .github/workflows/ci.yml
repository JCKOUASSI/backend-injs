name: CI

on:
  push:
  pull_request:

concurrency:
  # Même groupe pour le push et sa PR : ne pas rejouer deux fois 1695 tests
  # sur le même runner self-hosted (avec séparation des forks).
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: [self-hosted, macOS, ARM64, backend-injs]

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qr_badge
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"

    steps:
      - name: Démarrer PostgreSQL CI
        run: |
          set -euo pipefail
          # Un runner self-hosted peut traiter plusieurs branches : ni le nom
          # du conteneur ni le port de l'hôte ne doivent être partagés.
          CONTAINER="injs-postgres-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d \
            --name "$CONTAINER" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=qr_badge \
            -p 127.0.0.1::5432 \
            postgres:16-alpine

          PORT="$(docker port "$CONTAINER" 5432/tcp | awk -F: '{print $NF}')"
          if [[ ! "$PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::Port PostgreSQL CI introuvable"
            exit 1
          fi
          echo "POSTGRES_PORT=$PORT" >> "$GITHUB_ENV"

          for i in {1..30}; do
            if docker exec "$CONTAINER" pg_isready -U postgres -d qr_badge; then
              exit 0
            fi
            sleep 2
          done

          echo "::error::PostgreSQL CI n'est pas prêt"
          docker logs "$CONTAINER"
          exit 1

      - uses: actions/checkout@v4

      - name: Préparer Python 3.12 CI
        run: |
          rm -rf .venv-ci
          /opt/homebrew/bin/python3.12 -m venv .venv-ci
          .venv-ci/bin/python --version
          .venv-ci/bin/python -m pip install --upgrade pip


      - name: Installer les dépendances Python
        run: .venv-ci/bin/pip install -r backend/requirements.txt

      - name: Hygiène du dépôt (données nominatives)
        working-directory: backend
        run: ../.venv-ci/bin/python manage.py check_repo_hygiene

      - name: Collecte des fichiers statiques (manifeste WhiteNoise)
        working-directory: backend
        # staticfiles/ n'est plus versionné (P00-02) : le manifeste requis par
        # ManifestStaticFilesStorage doit être généré avant les tests de templates.
        run: SECRET_KEY=ci-secret-key-not-for-production DEBUG=True ../.venv-ci/bin/python manage.py collectstatic --noinput

      - name: Migrations et tests
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
        run: |
          ../.venv-ci/bin/python manage.py migrate --noinput
          ../.venv-ci/bin/python manage.py test --noinput -v 2

      - name: Contrat d'API figé (snapshot drf-spectacular, P00-08)
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
        # Échoue si une route / clé requise / code HTTP a été retiré ou renommé
        # sans mise à jour justifiée du snapshot (docs/api/contract.snapshot.json).
        run: ../.venv-ci/bin/python manage.py export_api_contract --check

      - name: Parcours de fumée bout-en-bout (smoke INJS-LMD, P00-08)
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
        # Base neuve : la commande s'auto-ensemence et annule sa transaction
        # en fin (idempotente) ; tout échec d'une étape rend le build rouge.
        run: ../.venv-ci/bin/python manage.py smoke_test_injs

      - name: Parcours de fumée d'authentification CURP (U0, 14 comptes témoins)
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
          COMPTE_TEMOIN_MOT_DE_PASSE: "Fumee-CI#2026"
        # Auto-ensemence idempotemment les 14 comptes témoins (12 rôles +
        # double secrétariat) puis prouve : connexion web des 10 rôles web,
        # refus web + canal mobile pour FORMATEUR/AUDITEUR, routes de
        # référence à 200 et cloisonnement croisé entre deux secrétariats.
        # Une seule ligne rouge rend le build rouge (sortie 1).
        run: ../.venv-ci/bin/python manage.py fumee_authentification --tous --creer

      - name: "Socle CURP habilitations : politique et intégrité du journal (U1)"
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
        # Crée la politique de sécurité singleton (idempotent, aucun droit
        # peuplé en U1), puis vérifie le chaînage SHA-256 du journal. Sur
        # PostgreSQL, les déclencheurs BEFORE UPDATE/DELETE sont également
        # actifs et testés par la suite unitaire.
        run: |
          ../.venv-ci/bin/python manage.py init_habilitations_injs
          ../.venv-ci/bin/python manage.py verifier_chaine_habilitations

      - name: "CURP U2 : moteur d'habilitation en mode observation"
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
          # U2 : observation pure, les refus ne sont jamais appliqués.
          HABILITATIONS_OBSERVATION: "true"
          HABILITATIONS_APPLICATION: "false"
        # Aucun refus n'est appliqué en U2 ; la commande sort toujours 0.
        # Avant U3 (référentiel) et U8 (rattachement des comptes), la
        # campagne est explicitement sans objet : elle vérifie le mécanisme.
        run: |
          ../.venv-ci/bin/python manage.py observations_habilitations
          ../.venv-ci/bin/python manage.py observations_habilitations --campagne

      - name: Intégrité du journal d'audit unifié (P01-01)
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
        # Vérifie en lecture seule codes uniques, séquences continues et
        # répliques non dupliquées/orphelines du registre core.
        run: ../.venv-ci/bin/python manage.py audit_integrity_check

      - name: Vérifier l'image Docker backend (collectstatic / permissions)
        run: |
          IMAGE="sygep-backend-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build -t "$IMAGE" ./backend
          bash scripts/check-backend-image.sh "$IMAGE"

      - name: Nettoyer PostgreSQL et l'image CI
        if: always()
        run: |
          docker rm -f "injs-postgres-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>/dev/null || true
          docker image rm "sygep-backend-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>/dev/null || true
          rm -rf .venv-ci

  frontend:
    name: Frontend (Vite / React)
    runs-on: [self-hosted, macOS, ARM64, backend-injs]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer et vérifier
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  frontend-tests:
    name: Frontend tests (Vitest)
    runs-on: [self-hosted, macOS, ARM64, backend-injs]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Tests unitaires, composants et smoke (avec seuils de couverture)
        working-directory: frontend
        # Le code de sortie de Vitest est non nul si un test échoue OU si un
        # seuil de couverture (vitest.config.js) n'est pas atteint.
        run: npm run test:coverage

      - name: Archiver le rapport de couverture HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  mobile:
    name: Mobile (Flutter)
    runs-on: [self-hosted, macOS, ARM64, backend-injs]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.7"
          # Sur le runner self-hosted, le post-job de cache Flutter peut rester
          # bloqué après une analyse pourtant réussie. Le SDK reste installé
          # sur ce runner ; ne pas archiver ses gigaoctets dans Actions cache.
          cache: false

      - name: Prepare Flutter CI environment
        working-directory: qr_badge_mobile
        run: |
          mkdir -p assets
          cp .env.example assets/app.env

      - name: Pub get et analyse statique
        working-directory: qr_badge_mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
