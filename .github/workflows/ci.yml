name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qr_badge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qr_badge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qr_badge
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances Python
        run: pip install -r backend/requirements.txt

      - name: Hygiène du dépôt (données nominatives)
        working-directory: backend
        run: python manage.py check_repo_hygiene

      - name: Collecte des fichiers statiques (manifeste WhiteNoise)
        working-directory: backend
        # staticfiles/ n'est plus versionné (P00-02) : le manifeste requis par
        # ManifestStaticFilesStorage doit être généré avant les tests de templates.
        run: SECRET_KEY=ci-secret-key-not-for-production DEBUG=True python manage.py collectstatic --noinput

      - name: Migrations et tests
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
        run: |
          python manage.py migrate --noinput
          python manage.py test --noinput -v 2

      - name: Contrat d'API figé (snapshot drf-spectacular, P00-08)
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
        # Échoue si une route / clé requise / code HTTP a été retiré ou renommé
        # sans mise à jour justifiée du snapshot (docs/api/contract.snapshot.json).
        run: python manage.py export_api_contract --check

      - name: Parcours de fumée bout-en-bout (smoke INJS-LMD, P00-08)
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
        # Base neuve : la commande s'auto-ensemence et annule sa transaction
        # en fin (idempotente) ; tout échec d'une étape rend le build rouge.
        run: python manage.py smoke_test_injs

      - name: Parcours de fumée d'authentification CURP (U0, 14 comptes témoins)
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
          COMPTE_TEMOIN_MOT_DE_PASSE: "Fumee-CI#2026"
        # Auto-ensemence idempotemment les 14 comptes témoins (12 rôles +
        # double secrétariat) puis prouve : connexion web des 10 rôles web,
        # refus web + canal mobile pour FORMATEUR/AUDITEUR, routes de
        # référence à 200 et cloisonnement croisé entre deux secrétariats.
        # Une seule ligne rouge rend le build rouge (sortie 1).
        run: python manage.py fumee_authentification --tous --creer

      - name: "Socle CURP habilitations : politique et intégrité du journal (U1)"
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
        # Crée la politique de sécurité singleton (idempotent, aucun droit
        # peuplé en U1), puis vérifie le chaînage SHA-256 du journal. Sur
        # PostgreSQL, les déclencheurs BEFORE UPDATE/DELETE sont également
        # actifs et testés par la suite unitaire.
        run: |
          python manage.py init_habilitations_injs
          python manage.py verifier_chaine_habilitations

      - name: "CURP U2 : moteur d'habilitation en mode observation"
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
          # U2 : observation pure, les refus ne sont jamais appliqués.
          HABILITATIONS_OBSERVATION: "true"
          HABILITATIONS_APPLICATION: "false"
        # Aucun refus n'est appliqué en U2 ; la commande sort toujours 0.
        # Avant U3 (référentiel) et U8 (rattachement des comptes), la
        # campagne est explicitement sans objet : elle vérifie le mécanisme.
        run: |
          python manage.py observations_habilitations
          python manage.py observations_habilitations --campagne

      - name: Intégrité du journal d'audit unifié (P01-01)
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
        # Vérifie en lecture seule codes uniques, séquences continues et
        # répliques non dupliquées/orphelines du registre core.
        run: python manage.py audit_integrity_check

      - name: Vérifier l'image Docker backend (collectstatic / permissions)
        run: |
          docker build -t sygep-backend-ci ./backend
          OWNER=$(docker run --rm sygep-backend-ci stat -c '%U' /app/staticfiles)
          if [ "$OWNER" != "appuser" ]; then
            echo "::error::/app/staticfiles appartient à ${OWNER} (attendu: appuser)"
            exit 1
          fi
          docker run --rm sygep-backend-ci python manage.py collectstatic --noinput --dry-run

  frontend:
    name: Frontend (Vite / React)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer et vérifier
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  frontend-tests:
    name: Frontend tests (Vitest)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Tests unitaires, composants et smoke (avec seuils de couverture)
        working-directory: frontend
        # Le code de sortie de Vitest est non nul si un test échoue OU si un
        # seuil de couverture (vitest.config.js) n'est pas atteint.
        run: npm run test:coverage

      - name: Archiver le rapport de couverture HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  mobile:
    name: Mobile (Flutter)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.7"
          cache: true

      - name: Pub get et analyse statique
        working-directory: qr_badge_mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
