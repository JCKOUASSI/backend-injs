name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    # La suite exhaustive Django a pris 56 min 54 s sur le run vert de
    # référence et 89 min 40 s sur le run le plus récent. 120 minutes laisse
    # une marge de sécurité mesurée tout en bornant un blocage à 2 heures.
    timeout-minutes: 120

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "55432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qr_badge
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pip-cache
          key: ${{ runner.os }}-arm64-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-arm64-pip-

      - name: Démarrer PostgreSQL CI
        shell: bash
        run: |
          # Le runner self-hosted partage Docker avec les autres jobs. La
          # suppression et le démarrage non bornés pouvaient rester bloqués
          # plusieurs heures dans docker rm/docker run.
          /opt/homebrew/bin/python3.12 - <<'PY'
          import subprocess
          import sys
          import time

          def docker(*args, timeout=30):
              return subprocess.run(
                  ["docker", *args],
                  check=True,
                  text=True,
                  capture_output=True,
                  timeout=timeout,
              )

          try:
              subprocess.run(
                  ["docker", "rm", "-f", "injs-postgres-ci"],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  timeout=30,
              )
              docker(
                  "run", "-d",
                  "--name", "injs-postgres-ci",
                  "-e", "POSTGRES_USER=postgres",
                  "-e", "POSTGRES_PASSWORD=postgres",
                  "-e", "POSTGRES_DB=qr_badge",
                  "-p", "127.0.0.1:55432:5432",
                  "postgres:16-alpine",
                  timeout=60,
              )
              for _ in range(30):
                  try:
                      docker(
                          "exec", "injs-postgres-ci",
                          "pg_isready", "-U", "postgres", "-d", "qr_badge",
                          timeout=10,
                      )
                      sys.exit(0)
                  except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                      time.sleep(2)
              print("::error::PostgreSQL CI n'est pas prêt", file=sys.stderr)
              try:
                  result = docker("logs", "--tail", "100", "injs-postgres-ci", timeout=10)
                  print(result.stdout, file=sys.stderr)
                  print(result.stderr, file=sys.stderr)
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as exc:
                  print(f"Logs PostgreSQL indisponibles: {exc}", file=sys.stderr)
              sys.exit(1)
          except subprocess.TimeoutExpired:
              print("::error::Command Docker CI limitée dans le temps", file=sys.stderr)
              sys.exit(1)
          except subprocess.CalledProcessError as exc:
              print(f"::error::Command Docker CI échouée: {exc}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Préparer Python 3.12 CI
        run: |
          /opt/homebrew/bin/python3.12 -m venv --clear .venv-ci
          .venv-ci/bin/python --version

      - name: Installer les dépendances Python
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
          # Le runner self-hosted peut subir des délais réseau intermittents
          # vers PyPI. On conserve l'installation réelle, mais on augmente
          # les retries et le timeout sans supprimer de contrôle.
          PIP_DEFAULT_TIMEOUT: "60"
          PIP_RETRIES: "8"
        run: .venv-ci/bin/pip install -r backend/requirements.txt

      - name: Hygiène du dépôt (données nominatives)
        working-directory: backend
        run: ../.venv-ci/bin/python manage.py check_repo_hygiene

      - name: Collecte des fichiers statiques (manifeste WhiteNoise)
        working-directory: backend
        # staticfiles/ n'est plus versionné (P00-02) : le manifeste requis par
        # ManifestStaticFilesStorage doit être généré avant les tests de templates.
        run: SECRET_KEY=ci-secret-key-not-for-production DEBUG=True ../.venv-ci/bin/python manage.py collectstatic --noinput

      - name: Migrations et tests
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
        run: |
          ../.venv-ci/bin/python manage.py migrate --noinput
          # Deux workers isolent leurs bases PostgreSQL de test et réduisent
          # le temps d'exécution sans retirer aucun test de la suite.
          ../.venv-ci/bin/python manage.py test --parallel 2 --noinput -v 2
      - name: Contrat d'API figé (snapshot drf-spectacular, P00-08)
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
        # Échoue si une route / clé requise / code HTTP a été retiré ou renommé
        # sans mise à jour justifiée du snapshot (docs/api/contract.snapshot.json).
        run: ../.venv-ci/bin/python manage.py export_api_contract --check

      - name: Parcours de fumée bout-en-bout (smoke INJS-LMD, P00-08)
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
        # Base neuve : la commande s'auto-ensemence et annule sa transaction
        # en fin (idempotente) ; tout échec d'une étape rend le build rouge.
        run: ../.venv-ci/bin/python manage.py smoke_test_injs

      - name: Parcours de fumée d'authentification CURP (U0, 14 comptes témoins)
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
          COMPTE_TEMOIN_MOT_DE_PASSE: "Fumee-CI#2026"
        # Auto-ensemence idempotemment les 14 comptes témoins (12 rôles +
        # double secrétariat) puis prouve : connexion web des 10 rôles web,
        # refus web + canal mobile pour FORMATEUR/AUDITEUR, routes de
        # référence à 200 et cloisonnement croisé entre deux secrétariats.
        # Une seule ligne rouge rend le build rouge (sortie 1).
        run: ../.venv-ci/bin/python manage.py fumee_authentification --tous --creer

      - name: "Socle CURP habilitations : politique et intégrité du journal (U1)"
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
        # Crée la politique de sécurité singleton (idempotent, aucun droit
        # peuplé en U1), puis vérifie le chaînage SHA-256 du journal. Sur
        # PostgreSQL, les déclencheurs BEFORE UPDATE/DELETE sont également
        # actifs et testés par la suite unitaire.
        run: |
          ../.venv-ci/bin/python manage.py init_habilitations_injs
          ../.venv-ci/bin/python manage.py verifier_chaine_habilitations

      - name: "CURP U2 : moteur d'habilitation en mode observation"
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
          # U2 : observation pure, les refus ne sont jamais appliqués.
          HABILITATIONS_OBSERVATION: "true"
          HABILITATIONS_APPLICATION: "false"
        # Aucun refus n'est appliqué en U2 ; la commande sort toujours 0.
        # Avant U3 (référentiel) et U8 (rattachement des comptes), la
        # campagne est explicitement sans objet : elle vérifie le mécanisme.
        run: |
          ../.venv-ci/bin/python manage.py observations_habilitations
          ../.venv-ci/bin/python manage.py observations_habilitations --campagne

      - name: Intégrité du journal d'audit unifié (P01-01)
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
        # Vérifie en lecture seule codes uniques, séquences continues et
        # répliques non dupliquées/orphelines du registre core.
        run: ../.venv-ci/bin/python manage.py audit_integrity_check

      - name: Vérifier l'image Docker backend (collectstatic / permissions)
        run: |
          docker build -t sygep-backend-ci ./backend
          # Ces contrôles sont statiques : ils ne doivent pas déclencher
          # l'entrypoint de production, qui attend PostgreSQL avant d'exécuter
          # la commande. Le build ci-dessus valide déjà collectstatic.
          OWNER=$(docker run --rm --entrypoint python sygep-backend-ci -c "import os, pwd; print(pwd.getpwuid(os.stat('/app/staticfiles').st_uid).pw_name)")
          if [ "$OWNER" != "appuser" ]; then
            echo "::error::/app/staticfiles appartient à ${OWNER} (attendu: appuser)"
            exit 1
          fi
          docker run --rm --entrypoint python sygep-backend-ci manage.py collectstatic --noinput --dry-run

      - name: Nettoyer PostgreSQL CI
        if: always()
        shell: bash
        run: |
          /opt/homebrew/bin/python3.12 - <<'PY'
          import subprocess
          import sys
          try:
              subprocess.run(
                  ["docker", "rm", "-f", "injs-postgres-ci"],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  timeout=30,
              )
          except subprocess.TimeoutExpired:
              print("::warning::Nettoyage PostgreSQL CI non terminé dans la limite", file=sys.stderr)
          PY

  frontend:
    name: Frontend (Vite / React)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer et vérifier
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  frontend-tests:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Tests unitaires, composants et smoke (avec seuils de couverture)
        working-directory: frontend
        # Le code de sortie de Vitest est non nul si un test échoue OU si un
        # seuil de couverture (vitest.config.js) n'est pas atteint.
        run: npm run test:coverage

      - name: Archiver le rapport de couverture HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.7"
          cache: true

      - name: Prepare Flutter CI environment
        working-directory: qr_badge_mobile
        run: |
          mkdir -p assets
          cp .env.example assets/app.env

      - name: Pub get et analyse statique
        working-directory: qr_badge_mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
