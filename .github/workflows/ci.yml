name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qr_badge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qr_badge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qr_badge
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances Python
        run: pip install -r backend/requirements.txt

      - name: Migrations et tests
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py test --noinput -v 2

  frontend:
    name: Frontend (Vite / React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer et vérifier
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get et analyse statique
        working-directory: qr_badge_mobile
        run: |
          flutter pub get
          flutter analyze
