name: TMP regen pubspec lock

on:
  pull_request:
    branches: [main]
  push:
    branches: ['arena/**']

jobs:
  regen:
    name: Regenerate pubspec.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.7"
      - name: Regenerate lockfile
        working-directory: qr_badge_mobile
        run: flutter pub get
      - name: Show diff
        working-directory: qr_badge_mobile
        run: |
          git diff --stat -- pubspec.lock || true
          git --no-pager diff -- pubspec.lock | head -160 || true
      - name: Commit regenerated lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qr_badge_mobile/pubspec.lock
          if git diff --cached --quiet; then echo "Aucune modification du lock"; exit 0; fi
          git commit -m "Regen pubspec.lock avec Flutter 3.41.7"
          git push
