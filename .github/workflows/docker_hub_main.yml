# Branche `main` (production) — build & push linux/amd64 vers Docker Hub.
#
# Cible d’exécution : AlmaLinux x86_64 (--platform linux/amd64).
#
# Équivalent local :
#   backend  : docker buildx build --platform linux/amd64 -t jckouassi/injs-be:latest --push ./backend
#   frontend : docker buildx build --platform linux/amd64 \
#                --build-arg VITE_API_BASE_URL=https://inj.badge-qr-code.pro/api/v1 \
#                -t jckouassi/injs-fe:latest --push ./ings-fe
#
# Secrets GitHub OBLIGATOIRES (Settings → Secrets and variables → Actions) :
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# Sans ces secrets le job échoue à « Username and password required »
# (constat du 12/08/2026 sur ce dépôt).
#
# Tags poussés à chaque run (prod) :
#   - tag versionné (auto ou manuel), ex: v1.0.123-amd64
#   - main-<tag_versionné>
#   - latest-amd64 + latest
#   - channel1-latest-amd64 (tag effectivement servi par injs.badge-qr-code.pro)

name: Docker Hub (main / prod)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 1.0.44). Vide => auto via run_number"
        required: false
        type: string
      backend_tag:
        description: "Tag backend (override total). Vide => calculé"
        required: false
        type: string
      frontend_tag:
        description: "Tag frontend (override total). Vide => calculé"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: docker-hub-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push prod (linux/amd64)
    runs-on: ubuntu-latest
    env:
      BACKEND_IMAGE: jckouassi/injs-be
      FRONTEND_IMAGE: jckouassi/injs-fe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Tags et build-args (prod)
        id: cfg
        run: |
          PREFIX="${DOCKER_MAIN_VERSION_PREFIX:-1.0}"
          AUTO="v${PREFIX}.${GITHUB_RUN_NUMBER}-amd64"
          REQ_VERSION="${{ inputs.version }}"
          if [ -n "${REQ_VERSION}" ]; then
            AUTO="v${REQ_VERSION}-amd64"
          fi

          BT="${{ inputs.backend_tag }}"
          FT="${{ inputs.frontend_tag }}"
          if [ -z "${BT}" ]; then BT="${DOCKER_MAIN_BACKEND_TAG:-$AUTO}"; fi
          if [ -z "${FT}" ]; then FT="${DOCKER_MAIN_FRONTEND_TAG:-$AUTO}"; fi
          # Le SPA (injs.badge-qr-code.pro) et l'API (inj.badge-qr-code.pro) sont
          # servis par deux hôtes : une URL relative ne joindrait jamais l'API.
          API="${DOCKER_MAIN_VITE_API_BASE_URL:-https://inj.badge-qr-code.pro/api/v1}"
          echo "backend_ref=${BACKEND_IMAGE}:${BT}" >> "$GITHUB_OUTPUT"
          echo "frontend_ref=${FRONTEND_IMAGE}:${FT}" >> "$GITHUB_OUTPUT"
          echo "backend_main_ref=${BACKEND_IMAGE}:main-${BT}" >> "$GITHUB_OUTPUT"
          echo "frontend_main_ref=${FRONTEND_IMAGE}:main-${FT}" >> "$GITHUB_OUTPUT"
          echo "vite_api=${API}" >> "$GITHUB_OUTPUT"
        env:
          DOCKER_MAIN_VERSION_PREFIX: ${{ vars.DOCKER_MAIN_VERSION_PREFIX }}
          DOCKER_MAIN_BACKEND_TAG: ${{ vars.DOCKER_MAIN_BACKEND_TAG }}
          DOCKER_MAIN_FRONTEND_TAG: ${{ vars.DOCKER_MAIN_FRONTEND_TAG }}
          DOCKER_MAIN_VITE_API_BASE_URL: ${{ vars.DOCKER_MAIN_VITE_API_BASE_URL }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.cfg.outputs.backend_ref }}
            ${{ steps.cfg.outputs.backend_main_ref }}
            ${{ env.BACKEND_IMAGE }}:latest-amd64
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:channel1-latest-amd64

      - name: Vérifier staticfiles (appuser, collectstatic)
        run: |
          IMG="${{ steps.cfg.outputs.backend_ref }}"
          docker pull "$IMG"
          OWNER=$(docker run --rm --entrypoint stat "$IMG" \
            -c '%U' /app/staticfiles)
          if [ "$OWNER" != "appuser" ]; then
            echo "::error::/app/staticfiles appartient à ${OWNER} (attendu: appuser)."
            exit 1
          fi
          docker run --rm --entrypoint python -e SKIP_DB_SETUP=true "$IMG" \
            manage.py collectstatic --noinput --dry-run

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./ings-fe
          file: ./ings-fe/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.cfg.outputs.frontend_ref }}
            ${{ steps.cfg.outputs.frontend_main_ref }}
            ${{ env.FRONTEND_IMAGE }}:latest-amd64
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:channel1-latest-amd64
          build-args: |
            VITE_API_BASE_URL=${{ steps.cfg.outputs.vite_api }}
