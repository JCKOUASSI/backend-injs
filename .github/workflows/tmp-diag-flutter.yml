name: TMP diag flutter

on:
  push:
    branches: ['arena/**']
    paths-ignore:
      - 'CI_DIAG_flutter.txt'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.7"
      - name: Diagnostic pub get / analyze
        working-directory: qr_badge_mobile
        shell: bash
        run: |
          set +e
          OUT=../CI_DIAG_flutter.txt
          {
            echo "=== flutter pub get --enforce-lockfile ==="
            flutter pub get --enforce-lockfile
            echo "ENFORCE_EXIT=$?"
            echo "=== flutter pub get (resync) ==="
            flutter pub get
            echo "PUBGET_EXIT=$?"
            echo "=== diff lock apres resync ==="
            git --no-pager diff -- pubspec.lock
            echo "=== flutter analyze (60 dernieres lignes) ==="
            flutter analyze 2>&1 | tail -60
            echo "ANALYZE_EXIT=${PIPESTATUS[0]}"
          } > "$OUT" 2>&1
      - name: Renvoyer diagnostic et lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CI_DIAG_flutter.txt qr_badge_mobile/pubspec.lock
          if git diff --cached --quiet; then echo "Rien a renvoyer"; exit 0; fi
          git commit -m "TMP: diagnostic Flutter (a retirer)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
