name: Fix production admin

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Compte à diagnostiquer"
        required: false
        type: string
        default: "admin"
      container:
        description: "Conteneur backend sur le VPS"
        required: false
        type: string
        default: "injs-be"

permissions:
  contents: read

jobs:
  fix-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"

      - name: Préparer SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null

      # Le diagnostic est une commande de gestion du dépôt
      # (`authentication/management/commands/diagnostic_admin.py`), donc déjà
      # présente dans l'image. Il n'y a plus de code Python embarqué ici : la
      # version précédente en mettait à la colonne 1 dans un bloc `run: |`, ce
      # qui fermait le bloc scalaire et faisait échouer le workflow dès
      # l'analyse YAML, sans qu'aucune étape ne s'exécute.
      - name: Vérifier le compte admin en production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          CONTENEUR: ${{ github.event.inputs.container || 'injs-be' }}
          COMPTE: ${{ github.event.inputs.username || 'admin' }}
        run: |
          set -euo pipefail

          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "${VPS_USER}@${VPS_HOST}" \
            "docker exec ${CONTENEUR} python manage.py diagnostic_admin --username ${COMPTE}"
